# =============================================================================
#  إعداد nginx لخدمة واجهة PWA وتمرير نداءات الواجهة البرمجية
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # عامل الخدمة يجب ألا يُخزَّن، وإلا بقي المستخدم على نسخة قديمة
    # من التطبيق حتى بعد نشر تحديث
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # الأصول الثابتة تُخزَّن طويلاً
    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # تمرير نداءات الواجهة البرمجية إلى الخادم
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # تطبيق صفحة واحدة: أي مسار غير موجود يُعاد إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
