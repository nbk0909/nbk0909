# ==============================================================================
#  نظام المعلومات المدنية الشامل — تشغيل النظام كاملاً بأمر واحد
#      docker compose up -d
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: civil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?يجب ضبط POSTGRES_PASSWORD في ملف .env}
      POSTGRES_DB: ${POSTGRES_DB:-civil_db}
      # ترتيب وفرز مناسب للنصوص العربية
      LANG: ar_IQ.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
      # يُنفَّذ مخطط قاعدة البيانات تلقائياً عند أول إقلاع فقط
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civil_user} -d ${POSTGRES_DB:-civil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civil_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-civil_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-civil_db}
      SECRET_KEY: ${SECRET_KEY:?يجب ضبط SECRET_KEY في ملف .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?يجب ضبط FIELD_ENCRYPTION_KEY في ملف .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: nginx:alpine
    container_name: civil_web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads:
  backups:
